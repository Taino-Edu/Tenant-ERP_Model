# =============================================================================
# dev-swagger.conf — Host dedicado à referência da API (Swagger UI)
#
#   https://dev-swagger.3esysten.com.br  →  nginx  →  api:5000/swagger
#
# Por que um server block separado, e não um /swagger no host principal:
#
#  1. O host principal casa `*.3esysten.com.br` e entrega tudo ao frontend/API.
#     Um subdomínio qualquer daquele wildcard é lido como SLUG DE LOJA pelo
#     TenantResolutionMiddleware — "dev-swagger" não é tenant nenhum, então a
#     resposta seria 404 "Loja não encontrada". Por isso a API registra o
#     Swagger ANTES da resolução de tenant (ver Program.cs) e este bloco só
#     encaminha /swagger.
#  2. server_name exato vence wildcard no nginx, então este bloco ganha de
#     `*.3esysten.com.br` sem precisar de ordem de arquivo.
#  3. Só /swagger passa. Este host NÃO é uma segunda porta pra API real: /api,
#     /hubs, /mcp e o frontend respondem 404 aqui.
#
# Pré-requisitos:
#   - DNS: já coberto pelo wildcard *.3esysten.com.br apontando pro VPS.
#   - API: Swagger__Enabled=true no docker-compose.prod.yml (já está).
#
# ⚠️  ESTE HOST É PÚBLICO. A doc lista TODOS os endpoints, campos e regras de
#     autorização da API. Ela não dá acesso a dado nenhum (todo endpoint segue
#     exigindo o mesmo JWT), mas é um mapa da superfície de ataque. Pra fechar
#     com usuário/senha, descomente as duas linhas `auth_basic` abaixo e crie o
#     arquivo de senhas no VPS:
#
#       docker run --rm httpd:alpine htpasswd -nb dev SENHA_FORTE \
#         > /opt/tenant-erp/deploy/nginx/.htpasswd-swagger
#       cd /opt/tenant-erp/deploy && docker compose -f docker-compose.prod.yml \
#         exec nginx nginx -s reload
# =============================================================================

server {
    listen 80;
    server_name dev-swagger.3esysten.com.br;

    # Trocar o host da doc não deve virar porta de entrada pro resto.
    location / {
        return 404;
    }

    location /swagger {
        # auth_basic           "Tenant-ERP API — acesso restrito";
        # auth_basic_user_file /etc/nginx/conf.d/.htpasswd-swagger;

        set $api http://api:5000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Atalho: a raiz do host leva direto pra UI, em vez de devolver o 404 acima.
    location = / {
        return 302 /swagger;
    }
}
