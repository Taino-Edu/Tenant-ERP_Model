# Host dedicado à referência da API. O server_name exato vence o wildcard de
# tenants configurado em nginx.conf.
server {
    listen 80;
    server_name dev-swagger.3esysten.com.br;

    location = / {
        return 302 /swagger/;
    }

    location /swagger {
        set $api http://api:5000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # O host de documentação não expõe frontend, API, hubs ou MCP.
    location / {
        return 404;
    }
}
