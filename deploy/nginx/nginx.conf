# =============================================================================
# nginx.conf — Proxy reverso para o Tenant-ERP
# Cloudflare (HTTPS) → Nginx (HTTP 80) → containers Docker
# =============================================================================

# DNS interno do Docker — resolve upstreams em runtime (evita falha na startup)
resolver 127.0.0.11 valid=10s ipv6=off;

# IPs reais dos visitantes via Cloudflare
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

# -----------------------------------------------------------------------------
# Formato de log COM tempo. O formato padrão (combined) registra quem pediu o
# quê e o status — nunca quanto demorou.
#
# Isso custou caro em 20/08/2026: com o sistema "muito lento", o log não tinha
# como distinguir uma origem lenta de uma rede lenta, e a investigação gastou
# duas hipóteses erradas antes de medir na mão e descobrir que a aplicação
# respondia em 4ms e o atraso inteiro estava entre a internet e o nginx.
#
#   $request_time          — tempo total, do primeiro byte do request ao último
#                            byte da resposta enviado ao cliente
#   $upstream_response_time— quanto o container (Next.js ou API) levou
#
# A diferença entre os dois é o que o nginx e a rede do cliente somaram. Ver os
# dois lado a lado responde "é o app ou é o caminho?" sem precisar reproduzir.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Compressão na origem.
#
# O Cloudflare já entrega comprimido pro navegador — medido em 20/08/2026 na
# landing: 12.946 bytes com `Accept-Encoding: gzip, br` contra 77.938 sem. O que
# ele NÃO fazia era buscar comprimido daqui: pegava os 78 KB crus no Brasil e só
# comprimia depois, na borda.
#
# Isso importa mais neste servidor do que importaria em outro. O edge que atende
# está em Miami/Newark (plano free não é anunciado pelos PoPs brasileiros), então
# cada resposta atravessa o continente — e atravessava sem compressão. Cortar 6x
# o que trafega nessa perna é o ganho real; pro navegador não muda nada, porque
# lá já chegava comprimido.
#
# `gzip_proxied any` não é detalhe: sem ele o nginx pula a compressão em
# requisição que vem de proxy, que é 100% do tráfego aqui.
# -----------------------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml text/javascript
                  application/json application/javascript application/xml
                  application/xml+rss image/svg+xml;

log_format tempo '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time '
                 'cf=$http_cf_ray';
access_log /var/log/nginx/access.log tempo;

server {
    listen 80;
    # "_" mantém o fallback por IP puro; o domínio raiz e qualquer subdomínio
    # de tenant (*.3esysten.com.br, e o antigo *.2esysten.com.br mantido pelo
    # redirect na Cloudflare) são aceitos pelo mesmo server block — quem decide
    # o tenant a partir do Host é o TenantResolutionMiddleware, não o nginx.
    server_name _ 3esysten.com.br *.3esysten.com.br 2esysten.com.br *.2esysten.com.br;

    # Defesa do frontend (a API também aplica seus próprios headers). O navegador
    # recebe HTTPS do Cloudflare, portanto HSTS é válido mesmo com HTTP na rede
    # privada Cloudflare -> origem.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    # vlibras.gov.br: o widget de Libras é carregado pelo app (app/layout.tsx:108)
    # e a CSP não o listava — o navegador bloqueava o script e o recurso de
    # acessibilidade simplesmente não existia em produção, sem erro visível para
    # quem não abrisse o DevTools. Precisa de script-src (o plugin) e font-src
    # (os ícones do próprio widget).
    #
    # cdn.jsdelivr.net: o mesmo bug voltou por outro caminho. vlibras.gov.br
    # passou a responder 302 pro CDN
    # (cdn.jsdelivr.net/gh/spbgovbr-vlibras/vlibras-portal@v7.9.1/...), e a CSP
    # é avaliada no destino FINAL do redirect — liberar só o gov.br não basta
    # mais. O app continua apontando pro endereço oficial; quem mudou de casa
    # foi o governo. Sem isso o widget de Libras fica bloqueado de novo, de
    # novo sem erro visível pra quem não abre o DevTools.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://vlibras.gov.br https://cdn.jsdelivr.net https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://vlibras.gov.br https://cdn.jsdelivr.net; connect-src 'self' https: wss: https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.facebook.com; frame-src https://challenges.cloudflare.com" always;

    # Upload de imagens de produtos (até 10 MB)
    client_max_body_size 10M;

    # -------------------------------------------------------------------------
    # Frontend — Next.js 14
    # -------------------------------------------------------------------------
    location / {
        set $fe http://frontend:3000;
        proxy_pass         $fe;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # O padrão do nginx é 8 buffers de 4k/8k — cerca de 32 a 64 KB. Uma
        # resposta maior que isso é escrita num arquivo temporário em disco e
        # lida de volta, o que apareceu no error.log como
        # "an upstream response is buffered to a temporary file" a cada
        # carregamento da landing (a arte do hero tem ~950 KB).
        #
        # 1 MB cobre a maior resposta estática que o Next serve hoje sem tocar
        # o disco. Acima disso volta a cair no arquivo temporário, que é o
        # comportamento certo — o objetivo não é acomodar qualquer tamanho, é
        # não pagar I/O por um caso conhecido e recorrente.
        proxy_buffers      16 64k;
        proxy_buffer_size  16k;
        proxy_busy_buffers_size 128k;
    }

    # -------------------------------------------------------------------------
    # Chat da IA em streaming (SSE) — mesmo motivo do /mcp abaixo: sem
    # buffering off o nginx segura os eventos até a resposta fechar, e o
    # widget recebe tudo de uma vez só, cancelando o ganho do streaming.
    # Precisa de location própria porque é mais específica que /api/ (nginx
    # já prioriza o prefixo mais longo, não importa a ordem no arquivo).
    # -------------------------------------------------------------------------
    location /api/ai/chat/stream {
        set $api http://api:5000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # API — ASP.NET Core 8
    # -------------------------------------------------------------------------
    location /api/ {
        set $api http://api:5000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # MCP — o tenant pluga a IA dele no ERP (ver CardGameStore/Mcp/ErpTools.cs)
    #
    # Precisa de bloco próprio: /mcp não está sob /api/, então sem isto cai no
    # "location /" e é servido pelo FRONTEND — o cliente MCP receberia a página
    # 404 do Next.js em vez do servidor MCP.
    #
    # buffering off + timeout longo: a resposta é Server-Sent Events (o SDK
    # responde "text/event-stream"), e com buffering o nginx segura os eventos
    # até fechar a resposta, o que trava o cliente MCP.
    # -------------------------------------------------------------------------
    location /mcp {
        set $api http://api:5000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # SignalR — WebSocket (dashboard em tempo real)
    # -------------------------------------------------------------------------
    location /hubs/ {
        set $api http://api:5000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # -------------------------------------------------------------------------
    # Health check
    # -------------------------------------------------------------------------
    location /health {
        set $api http://api:5000;
        proxy_pass       $api;
        proxy_set_header Host $host;
        access_log       off;
    }

    # -------------------------------------------------------------------------
    # Uploads estáticos (imagens de produtos)
    # -------------------------------------------------------------------------
    location /uploads/ {
        set $api http://api:5000;
        proxy_pass         $api;
        proxy_set_header   Host $host;
        expires            7d;
        add_header         Cache-Control "public, no-transform";
    }
}
