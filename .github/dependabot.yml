version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Plugin e parser têm peer dependency na mesma linha e quebram o npm ci
      # quando uma major é proposta sem a outra.
      typescript-eslint:
        patterns: ["@typescript-eslint/eslint-plugin", "@typescript-eslint/parser"]
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Next 16 e React 19 formam uma migração só: lint saiu do Next, o proxy
      # substitui o middleware e React/React DOM/tipos precisam subir juntos.
      # O Next continua fora desta lista para que a major permaneça visível;
      # React isolado fica bloqueado até a migração controlada MOD-001.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Runtime, CI e tipos serão alinhados manualmente à linha LTS. Node 26 só
      # vira LTS no fim de outubro de 2026; não antecipar seus tipos no Node 24.
      - dependency-name: "@types/node"
        versions: [">= 25.0.0"]
      # Tailwind 4 muda PostCSS, configuração e CSS; Lucide 1 remove ícones de
      # marcas usados no site. Ambas exigem migração de código (MOD-002/003).
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]
      # O Next resolve o compilador pelo pacote `typescript`; na major 7 ele não
      # o encontra e aborta o lint antes de compilar qualquer coisa. Reabrir
      # quando a versão do Next em uso declarar suporte.
      #
      # O Next em si NÃO entra aqui, de propósito: a major dele deve continuar
      # sendo proposta, porque é por onde chega correção de segurança do
      # framework.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Os dois projetos precisam subir no MESMO pull request. Atualizar só o
  # principal deixa o de testes referenciando uma versão anterior do mesmo
  # assembly, e o build falha com CS1705 antes de rodar um teste sequer.
  - package-ecosystem: nuget
    directories:
      - /CardGameStore
      - /tests/unit/CardGameStore.Tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Estes pacotes instrumentam a mesma suíte e devem permanecer alinhados.
      # A regra também evita dois deploys de produção para uma única atualização.
      coverage:
        patterns: ["coverlet.collector", "coverlet.msbuild"]
      backend-minor-patch:
        update-types: [minor, patch]
    # A solução tem alvo net10.0 (LTS, suporte até novembro de 2028). As majors
    # de EF Core, ASP.NET Core e Npgsql acompanham a major do runtime: a 11
    # proposta aqui não é atualização, é migração de framework — e o .NET 11 é
    # STS, com suporte mais curto que o 10. A próxima migração é para o 12 (LTS);
    # quando ela acontecer, esta lista é revista junto.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions*"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql*"
        update-types: [version-update:semver-major]
      # Versionado junto com o ASP.NET Core, apesar de não ser da Microsoft.
      - dependency-name: "AspNetCore.HealthChecks*"
        update-types: [version-update:semver-major]
      # A 10 traz o Microsoft.OpenApi 2.x e quebra os filtros do Swagger. No
      # net8.0 a 6.x atende; a major volta a ser avaliada na migração de
      # runtime, quando o caminho natural é Microsoft.AspNetCore.OpenApi.
      - dependency-name: "Swashbuckle.AspNetCore*"
        update-types: [version-update:semver-major]
      # A partir da 8 a licença é comercial e paga (Xceed); a 7.x ainda é
      # livre e continua podendo ser proposta. Depois dela, a alternativa
      # livre é o fork AwesomeAssertions.
      - dependency-name: "FluentAssertions"
        versions: [">= 8.0.0"]

  # Um PR por mês com todas as actions, em vez de um por action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Usamos a tag flutuante @v4, que já acompanha as minors. Sem isto o
      # Dependabot propõe fixar numa versão exata a cada release da CodeQL.
      - dependency-name: "github/codeql-action"
        update-types: [version-update:semver-minor, version-update:semver-patch]
